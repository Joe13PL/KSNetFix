; KSNetFix - KnightShift multiplayer synchronisation fix
; Put dinput8.dll + this file next to KnightShift.ex1 / KnightShift.ex2.
; Every option is local to this PC and compatible with players who do not
; have the fix, but the best results come when everybody installs it.

[KSNetFix]
Enabled=1

; Replace the engine's RDTSC clock (calibrated with ~0.1% error, and broken on
; CPUs with a TSC above 4.29 GHz) with an exact QPC-based clock, so all
; machines tick at exactly the same rate.
PreciseClock=1

; Request 1 ms Windows timer resolution so 33 ms game ticks are paced evenly.
TimerResolution=1

; When turns from the host are waiting in the queue, run whole extra game
; ticks (up to CatchUpMaxSpeed) until the client executes each turn as soon
; as it arrives - the joined player then reacts as fast as the host.
; CatchUpTarget = turns allowed to wait (0 = none, lowest input lag;
; 1 = one turn of buffer, smoother on very jittery connections).
CatchUp=1
CatchUpTarget=0
CatchUpGain=0.5
CatchUpMaxSpeed=3.0
CatchUpOnHost=0

; Report progress to the host every N executed turns (engine default: 2).
AckEveryTurns=1

; Host only: how many turns the host may run ahead of the slowest player
; before it waits (engine default 3), and the max spread of executed turns
; between players before the host throttles (engine default 4).
MaxTurnsAhead=5
MaxTurnSpread=6

; ksnetfix.log statistics every LogInterval seconds.
Log=1
LogInterval=10

; Write the engine's own (compiled-out) network debug trace to ksnettrace.log.
; Very verbose - only for diagnosing problems.
NetTrace=0

; Keep rendering from consuming simulation random numbers (a frame-rate
; dependent desync source). Only active in network games.
RngIsolation=1

; Log how each engine RNG stream is used (sim / render / SHARED).
RngMonitor=1

; Publish a hash of the simulation state in every packet and compare it with
; other KSNetFix players - logs "DESYNC DETECTED" when games diverge.
DesyncCheck=1
; RNG streams compared (bit per stream). 0x3F = gameplay streams; streams 6/7
; (0x68C/0x690) feed visual effects that depend on each player's camera.
DesyncStreamMask=0x3F

; Fix typing in text fields (lost / doubled / wrong letters with DirectInput).
KeyboardFix=1

; Testing only: allow two game instances on one PC (host + client locally).
; Also makes each instance present a different join identity, otherwise the
; host rejects the second one with "invalid serial number".
AllowMultipleInstances=0

[Steam]
; Multiplayer over Steam instead of LAN / Radmin: the game's "TCP/IP" option
; then lists and hosts sessions through Steam lobbies, and all traffic goes
; through Steam Networking (Steam Datagram Relay) - no ports to open.
; Every player needs KSNetFix with Steam enabled and the Steam client running.
; Enabled=0 restores the original DirectPlay (LAN / direct IP).
Enabled=1
; Steam App ID used for lobbies and relays. Every player must use the same one.
; 254060 = KnightShift (each player must own the game on Steam; friends see
;          "KnightShift"; Steam Datagram Relay verified for this App ID).
; 480    = Spacewar, Valve's public Steamworks test app (KSNetFix 2.0 default).
AppId=254060
; public = anyone with KSNetFix sees the session; friends = Steam friends only.
LobbyType=public
; Extra lobby / connection diagnostics in ksnetfix.log.
Verbose=0
